# Example device file for one radiator. Copy it into your ESPHome config folder
# (e.g. as radiatorfan1.yaml), adjust the substitutions and compile.
#
# The full configuration is pulled from GitHub as a package. For a second radiator,
# copy this file again with a different name and sensor addresses.
#
# Put wifi_ssid and wifi_password in your secrets.yaml (see secrets.yaml.example).

substitutions:
  name: radiatorfan1
  friendly_name: Radiator Fan 1

  # 1-Wire addresses of the DS18B20s on THIS radiator (shown in the boot log)
  addr_supply: "0x0000000000000000"
  addr_return: "0x0000000000000000"

  # Home Assistant entities (replace with your own; see README)
  ha_room_temp: sensor.living_room_temperature
  ha_thermostat: climate.living_room
  ha_defrost: binary_sensor.heat_pump_defrost
  ha_compressor: binary_sensor.heat_pump_compressor

  # Optional: other pins (GPIO numbers only)
  # pin_pwm: "25"
  # pin_tach: "26"
  # pin_onewire: "27"
  # pin_ds_power: "14"

packages:
  radiatorfan:
    url: https://github.com/mcc-tweakers/esphome-radiator-fans
    ref: main
    files: [esphome/radiatorfan.yaml]
    refresh: 1d
